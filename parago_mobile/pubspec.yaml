name: parago_mobile
description: ParaGO! mobile client scaffold
publish_to: "none"
version: 1.0.5+20

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.3+1
  geolocator: ^13.0.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_sign_in: ^6.2.1
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  socket_io_client: ^3.1.1
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
