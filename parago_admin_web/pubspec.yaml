name: parago_admin_web
description: ParaGO! admin web console
publish_to: "none"
version: 1.1.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  parago_map_ui:
    path: ../packages/parago_map_ui
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.3+1
  geolocator: ^13.0.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_sign_in: ^6.2.1
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  socket_io_client: ^3.1.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
